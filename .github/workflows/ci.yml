name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm check
      - name: Deterministic gate (M1-M2 — no LLM usage in packages)
        run: |
          if grep -rniE "@anthropic-ai|api\.anthropic|anthropic\.claude|openai|claude-(opus|sonnet|haiku|fable|[0-9])" packages/db packages/connectors packages/graph packages/state packages/shared --include="*.ts"; then
            echo "::error::LLM usage detected in packages/ — forbidden until M3 (CLAUDE.md deterministic gate)"
            exit 1
          fi
