name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm check
      - name: Deterministic gate (no LLM usage outside packages/llm + packages/intelligence)
        run: |
          # Denylist, not allowlist: new packages are gated by default. Only
          # packages/llm and packages/intelligence may touch model APIs (D-008);
          # the exemption is path-anchored so a nested dir named "llm" elsewhere
          # does not escape the gate.
          matches=$(grep -rniE "@anthropic-ai|api\.anthropic|anthropic\.claude|openai|claude-(opus|sonnet|haiku|fable|[0-9])" packages --include="*.ts" --exclude-dir=node_modules | grep -vE "^packages/(llm|intelligence)/" || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::LLM usage detected in a deterministic package (CLAUDE.md deterministic gate)"
            exit 1
          fi
